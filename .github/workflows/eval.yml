name: Evalgate Regression Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  evalgate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Run evalgate regression check
        id: eval
        continue-on-error: true
        env:
          EVALGATE_API_KEY: ${{ secrets.EVALGATE_API_KEY }}
          EVALGATE_GATEWAY_URL: ${{ vars.EVALGATE_GATEWAY_URL }}
        run: |
          if [ -n "$EVALGATE_API_KEY" ]; then
            python3 -m evalgate run \
              --target gateway \
              --model "${EVALGATE_MODEL:-gemini-2.5-flash}" \
              --suite cases/suite.json \
              --baseline cases/baseline.json \
              --out reports/latest.md \
              --fail-on-regression
          else
            python3 -m evalgate run \
              --target fixture \
              --suite cases/suite.json \
              --baseline cases/baseline.json \
              --out reports/latest.md \
              --fail-on-regression
          fi

      - name: Comment regression table on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('reports/latest.md')) return;
            const body = fs.readFileSync('reports/latest.md', 'utf8');
            const marker = '<!-- evalgate-report -->';
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.data.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: `${marker}\n${body}`,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `${marker}\n${body}`,
              });
            }

      - name: Enforce regression gate
        if: steps.eval.outcome == 'failure'
        run: exit 1
