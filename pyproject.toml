[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalgate"
version = "0.1.0"
description = "Zero-dependency CI/CD prompt & model regression gate with a Streamable HTTP MCP server"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mcp = [
    "mcp>=1.6.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
evalgate = "evalgate.runner:main"
evalgate-mcp = "evalgate.mcp_server:main"
